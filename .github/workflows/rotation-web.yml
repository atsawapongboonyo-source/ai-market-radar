name: Rotation Web Isolation Tests
on:
  push:
    branches: [feature/capital-rotation-offline-v1]
  pull_request:
    paths:
      - 'rotation_*.py'
      - 'rotation_templates/**'
      - 'test_rotation_web.py'
      - 'requirements-rotation-web.txt'
      - '.github/workflows/rotation-web.yml'
jobs:
  integration:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-rotation-web.txt pytest psutil
      - run: python -m pytest -q
      - run: python scripts/rotation_web_probe.py --output rotation-web-ram.json
