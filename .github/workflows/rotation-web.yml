name: Rotation Web Isolation Tests
on:
  push:
    branches: [feature/capital-rotation-offline-v1, feature/rotation-stock-decision-v1]
  pull_request:
    paths:
      - 'rotation_*.py'
      - 'app.py'
      - 'history_cache.py'
      - 'test_history_cache.py'
      - 'rotation_templates/**'
      - 'test_rotation_web.py'
      - 'scripts/rotation_web_probe.py'
      - 'scripts/rotation_memory_diagnostic.py'
      - 'requirements-rotation-web.txt'
      - '.github/workflows/rotation-web.yml'
jobs:
  integration:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-rotation-web.txt pytest psutil
      - run: python -m pytest -q
      - run: python scripts/rotation_web_probe.py --output rotation-web-ram.json
      - run: python scripts/rotation_memory_diagnostic.py --output rotation-memory-diagnostic.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-memory-${{ runner.os }}
          path: |
            rotation-web-ram.json
            rotation-memory-diagnostic.json
      - if: runner.os == 'Linux'
        run: python -m pip install playwright
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: python scripts/rotation_stock_mobile_probe.py
      - if: runner.os == 'Linux'
        run: python scripts/rotation_navigation_probe.py
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rotation-stock-mobile-qa
          path: |
            rotation-stock-mobile-*.png
            rotation-navigation-*.png
            rotation-navigation-results.json
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: rotation_test
          POSTGRES_USER: rotation
          POSTGRES_PASSWORD: disposable_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rotation -d rotation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ROTATION_TEST_DATABASE_URL: postgresql://rotation:disposable_ci_only@localhost:5432/rotation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-rotation-web.txt pytest psutil
      - run: python -m pytest -q test_rotation_postgres.py test_rotation_stock_postgres.py
      - run: python scripts/rotation_stock_pg_probe.py
