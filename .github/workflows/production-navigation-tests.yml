name: Production navigation isolation
on:
  pull_request:
    paths:
      - scanner.py
      - test_production_navigation.py
      - .github/workflows/production-navigation-tests.yml
permissions:
  contents: read
jobs:
  navigation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      SERVER_AUTO_MONITOR_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_production_navigation test_monitor_health
