name: Webull Quote Offline Tests
on:
  push:
    branches:
      - feature/webull-quote-autofill-offline-20261016
  pull_request:
    paths:
      - webull_quote_autofill.py
      - test_webull_quote_autofill.py
      - .github/workflows/webull-quote-offline.yml
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_webull_quote_autofill
      - run: python -m py_compile webull_quote_autofill.py test_webull_quote_autofill.py
