name: Multi-Radar Safety Tests

on:
  push:
    branches:
      - fix/multi-radar-timeout-20261008
  pull_request:
    paths:
      - multi_radar.py
      - scanner_v510.py
      - test_multi_radar_refresh_safety.py
      - .github/workflows/multi-radar-safety-tests.yml

jobs:
  multi-radar-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_multi_radar_refresh_safety
      - run: python -m py_compile multi_radar.py scanner_v510.py test_multi_radar_refresh_safety.py
