name: Worker Crash Diagnostics Tests

on:
  push:
    branches:
      - diagnostics/worker-crash-139-20261016
  pull_request:
    paths:
      - worker_crash_diagnostics.py
      - worker_crash_correlation.py
      - request_diagnostics_middleware.py
      - test_request_diagnostics_middleware.py
      - test_request_diagnostics_integration.py
      - test_request_diagnostics_e2e.py
      - test_request_diagnostics_gunicorn.py
      - test_request_diagnostics_gunicorn_app.py
      - test_scanner_diagnostics_entrypoint test_scanner_route_coverage.py
      - scanner.py
      - test_worker_crash_correlation.py
      - test_worker_crash_diagnostics.py
      - .github/workflows/worker-crash-diagnostics.yml

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Flask==3.1.2' 'gunicorn==23.0.0'
      - run: python -m unittest -v test_worker_crash_diagnostics test_worker_crash_correlation test_request_diagnostics_middleware test_request_diagnostics_integration test_request_diagnostics_e2e test_request_diagnostics_gunicorn test_scanner_diagnostics_entrypoint
      - run: python -m py_compile worker_crash_diagnostics.py test_worker_crash_diagnostics.py worker_crash_correlation.py test_worker_crash_correlation.py request_diagnostics_middleware.py test_request_diagnostics_middleware.py test_request_diagnostics_integration.py test_request_diagnostics_e2e.py test_request_diagnostics_gunicorn.py test_request_diagnostics_gunicorn_app.py test_scanner_diagnostics_entrypoint.py scanner.py
