name: Worker Crash Diagnostics Tests

on:
  push:
    branches:
      - diagnostics/worker-crash-139-20261016
  pull_request:
    paths:
      - worker_crash_diagnostics.py
      - worker_crash_correlation.py
      - request_diagnostics_middleware.py
      - test_request_diagnostics_middleware.py
      - test_request_diagnostics_integration.py
      - test_request_diagnostics_e2e.py
      - test_request_diagnostics_gunicorn.py
      - test_request_diagnostics_gunicorn_app.py
      - test_scanner_diagnostics_entrypoint.py
      - test_scanner_route_coverage.py
      - scanner.py
      - test_full_runtime_import_smoke.py
      - test_request_diagnostics_release_guard.py
      - Dockerfile.runtime-smoke
      - audit_native_dependencies.py
      - test_worker_crash_correlation.py
      - test_worker_crash_diagnostics.py
      - .github/workflows/worker-crash-diagnostics.yml

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Flask==3.1.2' 'gunicorn==23.0.0'
      - run: python -m unittest -v test_worker_crash_diagnostics test_worker_crash_correlation test_request_diagnostics_middleware test_request_diagnostics_integration test_request_diagnostics_e2e test_request_diagnostics_gunicorn test_scanner_diagnostics_entrypoint test_scanner_route_coverage
      - run: python -m py_compile worker_crash_diagnostics.py test_worker_crash_diagnostics.py worker_crash_correlation.py test_worker_crash_correlation.py request_diagnostics_middleware.py test_request_diagnostics_middleware.py test_request_diagnostics_integration.py test_request_diagnostics_e2e.py test_request_diagnostics_gunicorn.py test_request_diagnostics_gunicorn_app.py test_scanner_diagnostics_entrypoint.py test_scanner_route_coverage.py scanner.py

  full-runtime-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.runtime-smoke -t radar-smoke .
      - run: docker run --rm --network none -e SERVER_AUTO_MONITOR_ENABLED=0 -e TELEGRAM_TEST_ON_BOOT=0 -e LIVE_TRADING=0 -e RADAR_REQUEST_DIAGNOSTICS=0 radar-smoke
      - run: docker run --rm --network none -e SERVER_AUTO_MONITOR_ENABLED=0 -e TELEGRAM_TEST_ON_BOOT=0 -e LIVE_TRADING=0 -e RADAR_REQUEST_DIAGNOSTICS=1 radar-smoke

  release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_request_diagnostics_release_guard

  native-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.runtime-smoke -t radar-native-audit .
      - name: Inventory native dependencies without network access
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid --cap-drop ALL --security-opt no-new-privileges -e SERVER_AUTO_MONITOR_ENABLED=0 -e TELEGRAM_TEST_ON_BOOT=0 -e LIVE_TRADING=0 --entrypoint python radar-native-audit audit_native_dependencies.py

  native-import-repetition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.runtime-smoke -t radar-native-repeat .
      - name: Repeat native imports in isolated child processes
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid --cap-drop ALL --security-opt no-new-privileges -e SERVER_AUTO_MONITOR_ENABLED=0 -e TELEGRAM_TEST_ON_BOOT=0 -e LIVE_TRADING=0 --entrypoint python radar-native-repeat test_native_import_repetition.py
