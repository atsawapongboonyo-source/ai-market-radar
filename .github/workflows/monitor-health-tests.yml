name: Monitor Health Tests

on:
  push:
    branches:
      - fix/monitor-health-diagnostics-20261008
  pull_request:
    paths:
      - server_auto_monitor.py
      - test_monitor_health.py
      - .github/workflows/monitor-health-tests.yml

jobs:
  health-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_monitor_health
      - run: python -m py_compile server_auto_monitor.py test_monitor_health.py
